services:
  algotrader:
    build: .
    container_name: algotrader-pro
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUTF8=1
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/risk/status"]
      interval: 15s
      timeout: 5s
      retries: 3
